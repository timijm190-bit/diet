<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>饮食打卡</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2f8f5b">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f6f3;--card:#fff;--tx:#1f2a24;--mu:#6b7a71;--ac:#2f8f5b;--ac2:#dff1e6;--bd:#e3e8e4;--wa:#f0b34a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121715;--card:#1b2420;--tx:#e8efea;--mu:#93a39a;--ac:#4cc380;--ac2:#1f3a2b;--bd:#2a3730;--wa:#d9a441;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121715;--card:#1b2420;--tx:#e8efea;--mu:#93a39a;--ac:#4cc380;--ac2:#1f3a2b;--bd:#2a3730;--wa:#d9a441;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.w{max-width:560px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:20px;margin:4px 0 2px}
.sub{color:var(--mu);font-size:13px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.st{display:flex;gap:8px}
.chip{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:6px 10px;text-align:center;min-width:64px}
.chip b{display:block;font-size:18px;color:var(--ac)}
.chip span{font-size:11px;color:var(--mu)}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:14px 0 4px}
.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .3s}
.pt{font-size:13px;color:var(--mu);display:flex;justify-content:space-between}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px 14px;margin-top:12px}
.mh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mh h2{font-size:16px;margin:0}
.mh small{color:var(--mu);font-weight:400;margin-left:6px}
.btn{border:1px solid var(--ac);background:transparent;color:var(--ac);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer}
.btn.on{background:var(--ac);color:#fff}
.it{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--bd);cursor:pointer;user-select:none}
.it:first-of-type{margin-top:8px}
.cb{width:24px;height:24px;border-radius:50%;border:2px solid var(--bd);flex:none;display:grid;place-items:center;color:#fff;font-size:14px}
.it.d .cb{background:var(--ac);border-color:var(--ac)}
.it.d .nm{text-decoration:line-through;color:var(--mu)}
.nm{flex:1}.am{color:var(--mu);font-size:13px;text-align:right}
.tip{margin-top:6px;padding:8px 10px;background:var(--ac2);border-radius:10px;font-size:13px}
.cal{margin-top:12px}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.ch button{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:8px;width:34px;height:30px;font-size:16px;cursor:pointer}
.g{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.g .h{text-align:center;font-size:12px;color:var(--mu)}
.c{aspect-ratio:1;border-radius:10px;border:1px solid var(--bd);display:grid;place-items:center;font-size:13px;cursor:pointer;background:transparent;color:var(--tx);padding:0}
.c.f{background:var(--ac);border-color:var(--ac);color:#fff}
.c.p{background:var(--wa);border-color:var(--wa);color:#222}
.c.s{outline:2px solid var(--tx);outline-offset:1px}
.c.t{font-weight:700}
.c:disabled{opacity:.3;cursor:default}
.lg{display:flex;gap:12px;font-size:12px;color:var(--mu);margin-top:8px;flex-wrap:wrap}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.ft{text-align:center;margin-top:16px}
.ft button{background:none;border:none;color:var(--mu);font-size:13px;text-decoration:underline;cursor:pointer}
</style>
</head>
<body>
<div class="w">
  <div class="top">
    <div><h1>每日饮食打卡 🥗</h1><div class="sub" id="dl"></div></div>
    <div class="st"><div class="chip"><b id="sk">0</b><span>连续天数</span></div><div class="chip"><b id="tt">0</b><span>累计达标</span></div></div>
  </div>
  <div class="bar"><i id="bf"></i></div>
  <div class="pt"><span id="pl"></span><span id="ps"></span></div>
  <div id="ms"></div>
  <div class="card cal">
    <div class="ch"><button id="pm">‹</button><b id="mt"></b><button id="nx">›</button></div>
    <div class="g" id="gr"></div>
    <div class="lg"><span><i style="background:var(--ac)"></i>全部完成</span><span><i style="background:var(--wa)"></i>部分完成</span><span>点日期可查看或补卡</span></div>
  </div>
  <div class="ft"><button id="rs">清空当天记录</button></div>
</div>
<script>
var MEALS=[
{id:'b',n:'早餐',e:'🍞',r:1,it:[['全麦面包','1片'],['煮鸡蛋（全蛋）','1个'],['无糖豆浆 / 纯牛奶','200ml']],t:'优先选配料表第一位为全麦粉的吐司，避开甜面包、奶油吐司。'},
{id:'l',n:'午餐',e:'🍗',r:1,it:[['去皮鸡腿','2个'],['卤蛋','1个'],['清炒油麦菜','200g'],['熟米饭','100g（约半小碗）']],t:'鸡腿务必去皮；卤蛋少吃卤汁，避免高钠水肿；油麦菜少油清炒。'},
{id:'s',n:'下午加餐',e:'🍅',r:0,it:[['小番茄 / 黄瓜','100g / 1根']],t:'仅下午明显饥饿时吃，不饿直接跳过（不计入达标）。'},
{id:'d',n:'晚餐',e:'🍎',r:1,it:[['苹果 / 猕猴桃（直接吃，不榨汁）','1个，约200g'],['水煮蛋白 / 无糖酸奶','1个 / 100g']],t:'必须补充蛋白，避免夜间过度饥饿、掉肌肉。'}
];
var KEY='diet-checkin-v1',mem={},data={};
function load(){try{var s=localStorage.getItem(KEY);if(s)data=JSON.parse(s)||{}}catch(e){data=mem}}
function save(){mem=data;try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
function ks(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function pk(k){var a=k.split('-');return new Date(+a[0],+a[1]-1,+a[2])}
var today=ks(new Date()),sel=today,vm=pk(today);vm.setDate(1);
function get(k,m){var r=data[k]&&data[k][m.id];if(!r)r=m.it.map(function(){return 0});return r}
function stat(k){var done=0,tot=0,any=0;MEALS.forEach(function(m){var r=get(k,m);r.forEach(function(v){if(v)any++;if(m.r){tot++;if(v)done++}})});return{done:done,tot:tot,any:any,full:done===tot}}
function toggle(m,i){var r=get(sel,m).slice();r[i]=r[i]?0:1;(data[sel]=data[sel]||{})[m.id]=r;save();render()}
function all(m){var r=get(sel,m),v=r.every(Boolean)?0:1;(data[sel]=data[sel]||{})[m.id]=r.map(function(){return v});save();render()}
function streak(){var d=pk(today);if(!stat(ks(d)).full)d.setDate(d.getDate()-1);var n=0;while(stat(ks(d)).full){n++;d.setDate(d.getDate()-1)}return n}
function render(){
 var W=['日','一','二','三','四','五','六'],d=pk(sel);
 document.getElementById('dl').textContent=(d.getMonth()+1)+'月'+d.getDate()+'日 周'+W[d.getDay()]+(sel===today?'（今天）':'（补卡中）');
 var s=stat(sel),p=Math.round(s.done/s.tot*100);
 document.getElementById('bf').style.width=p+'%';
 document.getElementById('pl').textContent='正餐完成 '+s.done+'/'+s.tot+' 项';
 document.getElementById('ps').textContent=s.full?'🎉 今日达标':p+'%';
 var h='';
 MEALS.forEach(function(m){
  var r=get(sel,m),c=r.filter(Boolean).length,ok=c===r.length;
  h+='<div class="card"><div class="mh"><h2>'+m.e+' '+m.n+'<small>'+c+'/'+r.length+(m.r?'':'｜可选')+'</small></h2><button class="btn'+(ok?' on':'')+'" data-a="'+m.id+'">'+(ok?'已完成':'全部完成')+'</button></div>';
  m.it.forEach(function(x,i){h+='<div class="it'+(r[i]?' d':'')+'" data-m="'+m.id+'" data-i="'+i+'"><span class="cb">'+(r[i]?'✓':'')+'</span><span class="nm">'+x[0]+'</span><span class="am">'+x[1]+'</span></div>'});
  h+='<div class="tip">💡 '+m.t+'</div></div>';
 });
 document.getElementById('ms').innerHTML=h;
 var tot=0;Object.keys(data).forEach(function(k){if(stat(k).full)tot++});
 document.getElementById('sk').textContent=streak();
 document.getElementById('tt').textContent=tot;
 var y=vm.getFullYear(),mo=vm.getMonth(),fd=new Date(y,mo,1).getDay(),dn=new Date(y,mo+1,0).getDate();
 document.getElementById('mt').textContent=y+'年'+(mo+1)+'月';
 var g='';W.forEach(function(w){g+='<div class="h">'+w+'</div>'});
 for(var i=0;i<fd;i++)g+='<div></div>';
 for(var j=1;j<=dn;j++){var k=ks(new Date(y,mo,j)),st=stat(k),cl='c';
  if(st.full)cl+=' f';else if(st.any)cl+=' p';
  if(k===sel)cl+=' s';if(k===today)cl+=' t';
  g+='<button class="'+cl+'" data-d="'+k+'"'+(k>today?' disabled':'')+'>'+j+'</button>'}
 document.getElementById('gr').innerHTML=g;
}
document.getElementById('ms').addEventListener('click',function(e){
 var b=e.target.closest('[data-a]');if(b){all(MEALS.filter(function(m){return m.id===b.dataset.a})[0]);return}
 var t=e.target.closest('.it');if(t)toggle(MEALS.filter(function(m){return m.id===t.dataset.m})[0],+t.dataset.i)});
document.getElementById('gr').addEventListener('click',function(e){var b=e.target.closest('[data-d]');if(b&&!b.disabled){sel=b.dataset.d;render();window.scrollTo({top:0,behavior:'smooth'})}});
document.getElementById('pm').onclick=function(){vm.setMonth(vm.getMonth()-1);render()};
document.getElementById('nx').onclick=function(){vm.setMonth(vm.getMonth()+1);render()};
document.getElementById('rs').onclick=function(){delete data[sel];save();render()};
load();render();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
</body>
</html>
